<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Sky demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #info {
        position: fixed;
        left: 8px;
        top: 6px;
        color: #fff;
        font: 12px/1.4 monospace;
        text-shadow: 0 0 3px #000;
        pointer-events: none;
        white-space: pre;
      }
      body.shot #info {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info"></div>
    <script type="module" src="./sky.ts"></script>
  </body>
</html>
