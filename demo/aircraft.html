<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C172 model demo</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #20262e;
        overflow: hidden;
        font:
          13px system-ui,
          sans-serif;
        color: #dde;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #info {
        position: fixed;
        left: 8px;
        bottom: 6px;
        opacity: 0.75;
        pointer-events: none;
      }
      body.shot #info {
        display: none;
      }
      #fake {
        position: fixed;
        right: 8px;
        top: 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 8px;
        background: rgba(10, 14, 20, 0.7);
        border-radius: 6px;
        font-size: 12px;
        max-height: 95vh;
        overflow: auto;
      }
      #fake input[type='range'] {
        width: 110px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="info"></div>
    <div id="fake"></div>
    <script type="module" src="./aircraft.ts"></script>
  </body>
</html>
